name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coverband
          POSTGRES_PASSWORD: coverband
          POSTGRES_DB: coverband
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coverband -d coverband"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://coverband:coverband@localhost:5432/coverband
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
      # Local Garage, started below (same values as .env.example).
      S3_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: coverband
      S3_ACCESS_KEY_ID: GKc0ffeeb0a7d0000000000001
      S3_SECRET_ACCESS_KEY: c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d00001

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Known vulnerabilities in dependencies: fails on high and critical.
      # Ignored, no fixed version yet: GHSA-vfj7-8cjw-p6xm (braces, only in the shadcn CLI, a dev tool
      # run on our own patterns). Remove the --ignore once a fix is out.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Not a service container: Garage needs its config file from the repository.
      - name: Start object storage
        run: docker compose up -d --wait garage && sh docker/garage/init.sh

      - name: Migrate database
        run: bun run db:migrate

      - name: Test
        run: bun run test

      - name: Build web app
        run: bun run build
