name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# A new push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coverband
          POSTGRES_PASSWORD: coverband
          POSTGRES_DB: coverband
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coverband -d coverband"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://coverband:coverband@localhost:5432/coverband
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
      # Local Garage, started below (same values as .env.example).
      S3_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: coverband
      S3_ACCESS_KEY_ID: GKc0ffeeb0a7d0000000000001
      S3_SECRET_ACCESS_KEY: c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d00001

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Known vulnerabilities in dependencies: fails on high and critical.
      # Ignored, no fixed version yet: GHSA-vfj7-8cjw-p6xm (braces, only in the shadcn CLI, a dev tool
      # run on our own patterns) and GHSA-mrhx-c7xc-m3w5 (zod 3, only in the shadcn CLI too, which
      # validates the registries' answers with it; our own code is on zod 4.6.7). Remove an --ignore
      # once a fix is out.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-mrhx-c7xc-m3w5

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Not a service container: Garage needs its config file from the repository.
      - name: Start object storage
        run: docker compose up -d --wait garage && sh docker/garage/init.sh

      - name: Migrate database
        run: bun run db:migrate

      - name: Test
        run: bun run test

      - name: Build web app
        run: bun run build

  deploy-config:
    name: Production image and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Catches a broken Dockerfile before the deploy workflow does.
      - name: Build the production image
        run: docker build -t coverband .

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Check the infrastructure code
        working-directory: infra
        run: |
          tofu fmt -check -diff
          tofu init -backend=false -input=false
          tofu validate

  e2e:
    name: End-to-end tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coverband
          POSTGRES_PASSWORD: coverband
          POSTGRES_DB: coverband
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coverband -d coverband"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://coverband:coverband@localhost:5432/coverband
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_URL: http://localhost:8025
      MAIL_FROM: "Coverband <noreply@coverband.localhost>"
      # Test-only secret: this server never leaves the runner.
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-e2e
      S3_ENDPOINT: http://localhost:3900
      S3_REGION: garage
      S3_BUCKET: coverband
      S3_ACCESS_KEY_ID: GKc0ffeeb0a7d0000000000001
      S3_SECRET_ACCESS_KEY: c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d0c0ffeeb0a7d00001

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start object storage
        run: docker compose up -d --wait garage && sh docker/garage/init.sh

      - name: Migrate database
        run: bun run db:migrate

      # Without --with-deps: the runner already has the system libraries (it ships Chrome), and
      # their apt install from Ubuntu's mirror sometimes took 10 minutes (#230).
      - name: Install Chromium for Playwright
        working-directory: e2e
        run: bunx playwright install chromium

      # Builds the web app and serves it from the API on port 3100 (see e2e/playwright.config.ts).
      - name: End-to-end tests
        run: bun run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
