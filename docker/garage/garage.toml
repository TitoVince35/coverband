# Local Garage (S3-compatible object storage) for development and CI only: one node, no redundancy.
# Production uses Scaleway Object Storage. The secrets below are public development values.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "c0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ffeec0ff"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# Admin API, used by the web UI (garage-webui service, http://localhost:3909).
[admin]
api_bind_addr = "[::]:3903"
admin_token = "coverband-dev-admin-token"
