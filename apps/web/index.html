<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME%</title>
    <meta name="description" content="Repertoire, setlists and gigs for your band" />
    <meta name="theme-color" content="#0c090c" />
    <script>
      // Apply the saved colour theme before first paint (dark by default).
      // Mirrors src/lib/theme.ts: keep both in sync.
      (() => {
        let theme = "dark";
        try {
          theme = localStorage.getItem("coverband-theme") || "dark";
        } catch {}
        const dark =
          theme === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : theme !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0c090c" : "#007a55");
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <!-- Shown until the app's code has loaded and replaces it (#190): no text, it isn't translated yet. -->
    <div id="root">
      <div class="flex justify-center py-24" role="status" aria-busy="true">
        <span class="size-8 animate-spin rounded-full border-4 border-muted border-t-primary"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
