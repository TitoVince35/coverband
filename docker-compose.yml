# Local development services. Production uses Scaleway Serverless SQL Database, Scaleway TEM and
# Scaleway Object Storage.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coverband
      POSTGRES_PASSWORD: coverband
      POSTGRES_DB: coverband
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverband -d coverband"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every email sent locally: SMTP on 1025, web UI and API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible object storage on http://localhost:3900. Bucket and key: docker/garage/init.sh.
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Web UI for Garage on http://localhost:3909 (buckets, objects, keys). Reads garage.toml for the
  # admin token. Development only: the header's bucket button opens it.
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    ports:
      - "3909:3909"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
    depends_on:
      - garage

volumes:
  db-data:
  garage-data:
