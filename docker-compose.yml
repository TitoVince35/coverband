# Local development services. Production uses Scaleway Serverless SQL Database and Scaleway TEM.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coverband
      POSTGRES_PASSWORD: coverband
      POSTGRES_DB: coverband
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverband -d coverband"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every email sent locally: SMTP on 1025, web UI and API on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
