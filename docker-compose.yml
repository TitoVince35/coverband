# Local development services. Production uses Scaleway Serverless SQL Database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coverband
      POSTGRES_PASSWORD: coverband
      POSTGRES_DB: coverband
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverband -d coverband"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
